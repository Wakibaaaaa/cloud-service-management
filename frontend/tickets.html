<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Tickets - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="input-group search-box mb-0">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchInput" placeholder="Search tickets...">
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newTicketModal">
            <i class="bi bi-plus-lg"></i> New Ticket
          </button>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Ticket #</th>
                  <th>User</th>
                  <th>Resource</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Subject</th>
                  <th>Created</th>
                  <th>Days Open</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ticketsTableBody">
                <tr><td colspan="10" class="text-center text-muted">Loading tickets...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ===================== New Ticket Modal ===================== -->
  <div class="modal fade" id="newTicketModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-ticket-detailed-fill"></i> Raise a New Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="newTicketForm">
          <div class="modal-body">

            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" id="ticketSubject" placeholder="Briefly describe the issue" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" id="ticketCategory" required>
                <option value="">Loading...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Priority</label>
              <select class="form-select" id="ticketPriority" required>
                <option value="">Loading...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Related Resource (optional)</label>
              <select class="form-select" id="ticketResource">
                <option value="">None</option>
              </select>
            </div>

            <p id="ticketFormError" class="text-danger small mb-0"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const currentUser = requireLogin();
    renderSidebar('tickets');
    enableTableSearch('searchInput', 'ticketsTableBody');

    function priorityBadgeClass(priority) {
      if (priority === 'Critical') return 'bg-danger';
      if (priority === 'High') return 'bg-warning text-dark';
      if (priority === 'Medium') return 'bg-info text-dark';
      if (priority === 'Low') return 'bg-secondary';
      return 'bg-light text-dark border';
    }

    function statusBadgeClass(status) {
      if (status === 'Open') return 'bg-danger';
      if (status === 'InProgress') return 'bg-warning text-dark';
      if (status === 'Resolved') return 'bg-info text-dark';
      if (status === 'Closed') return 'bg-success';
      return 'bg-light text-dark border';
    }

    // ---------- READ: load and display tickets ----------
    function loadTickets() {
      fetch('http://localhost:3000/api/tickets')
        .then(response => response.json())
        .then(tickets => {
          const tableBody = document.getElementById('ticketsTableBody');
          tableBody.innerHTML = '';

          if (tickets.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" class="text-center text-muted">No tickets found.</td></tr>`;
            return;
          }

          tickets.forEach(t => {
            const priorityBadge = `<span class="badge ${priorityBadgeClass(t.priority)}">${t.priority}</span>`;
            const rowClass = (t.priority === 'Critical' && (t.status === 'Open' || t.status === 'InProgress'))
              ? 'table-danger' : '';

            // A small dropdown so the status can be changed right from the table
            const statusOptions = ['Open', 'InProgress', 'Resolved', 'Closed']
              .map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${s}</option>`)
              .join('');

            const row = `
              <tr class="${rowClass}">
                <td class="fw-semibold">${t.ticket_number}</td>
                <td>${t.username}</td>
                <td>${t.resource_name ?? '-'}</td>
                <td>${t.category}</td>
                <td>${priorityBadge}</td>
                <td>
                  <select class="form-select form-select-sm" style="width:130px;" 
                          onchange="updateTicketStatus(${t.ticket_id}, this.value)">
                    ${statusOptions}
                  </select>
                </td>
                <td>${t.subject}</td>
                <td>${new Date(t.created_at).toLocaleDateString()}</td>
                <td>${t.days_open} days</td>
                <td>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteTicket(${t.ticket_id})">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            `;
            tableBody.innerHTML += row;
          });
        })
        .catch(error => {
          console.error('Error fetching tickets:', error);
          document.getElementById('ticketsTableBody').innerHTML =
            `<tr><td colspan="10" class="text-center text-danger">Failed to load tickets. Is the backend server running?</td></tr>`;
        });
    }

    // ---------- UPDATE: change a ticket's status ----------
    function updateTicketStatus(ticketId, newStatus) {
      fetch(`http://localhost:3000/api/tickets/${ticketId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status_name: newStatus })
      })
        .then(response => response.json())
        .then(() => loadTickets()) // refresh the table so "days open" etc. stay accurate
        .catch(error => {
          console.error('Error updating ticket:', error);
          alert('Failed to update ticket status.');
        });
    }

    // ---------- DELETE: remove a ticket ----------
    function deleteTicket(ticketId) {
      if (!confirm('Are you sure you want to delete this ticket? This cannot be undone.')) {
        return;
      }
      fetch(`http://localhost:3000/api/tickets/${ticketId}`, { method: 'DELETE' })
        .then(response => response.json())
        .then(() => loadTickets())
        .catch(error => {
          console.error('Error deleting ticket:', error);
          alert('Failed to delete ticket.');
        });
    }

    // ---------- CREATE: populate the "New Ticket" form dropdowns ----------
    fetch('http://localhost:3000/api/ticket-options')
      .then(response => response.json())
      .then(options => {
        const categorySelect = document.getElementById('ticketCategory');
        categorySelect.innerHTML = options.categories
          .map(c => `<option value="${c.category_id}">${c.category_name}</option>`).join('');

        const prioritySelect = document.getElementById('ticketPriority');
        prioritySelect.innerHTML = options.priorities
          .map(p => `<option value="${p.priority_id}">${p.priority_name}</option>`).join('');

        const resourceSelect = document.getElementById('ticketResource');
        resourceSelect.innerHTML = '<option value="">None</option>' + options.resources
          .map(r => `<option value="${r.resource_id}">${r.resource_name}</option>`).join('');
      })
      .catch(error => console.error('Error loading ticket options:', error));

    // ---------- CREATE: handle the form submission ----------
    document.getElementById('newTicketForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const errorEl = document.getElementById('ticketFormError');
      errorEl.textContent = '';

      const payload = {
        user_id: currentUser.user_id,
        category_id: document.getElementById('ticketCategory').value,
        priority_id: document.getElementById('ticketPriority').value,
        resource_id: document.getElementById('ticketResource').value || null,
        subject: document.getElementById('ticketSubject').value
      };

      fetch('http://localhost:3000/api/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            errorEl.textContent = data.error;
            return;
          }
          // Close the modal, reset the form, refresh the table
          bootstrap.Modal.getInstance(document.getElementById('newTicketModal')).hide();
          document.getElementById('newTicketForm').reset();
          loadTickets();
        })
        .catch(error => {
          console.error('Error creating ticket:', error);
          errorEl.textContent = 'Could not reach the server.';
        });
    });

    // Initial load
    loadTickets();
  </script>

</body>
</html>
