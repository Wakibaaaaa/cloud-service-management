<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Health - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search resource health...">
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Resource Name</th>
                  <th>Type</th>
                  <th>Region</th>
                  <th>Owner</th>
                  <th>CPU %</th>
                  <th>Memory %</th>
                  <th>Storage (GB)</th>
                  <th>Errors</th>
                  <th>Health</th>
                </tr>
              </thead>
              <tbody id="healthTableBody">
                <tr><td colspan="9" class="text-center text-muted">Loading resource health...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('resource-health');
    enableTableSearch('searchInput', 'healthTableBody');

    function healthBadgeClass(status) {
      if (status === 'CRITICAL') return 'bg-danger';
      if (status === 'WARNING') return 'bg-warning text-dark';
      if (status === 'HEALTHY') return 'bg-success';
      if (status === 'STOPPED') return 'bg-secondary';
      return 'bg-light text-dark border';
    }

    function formatMetric(value) {
      return (value === null || value === undefined) ? '—' : value;
    }

    fetch('http://localhost:3000/api/resource-health')
      .then(response => response.json())
      .then(resources => {
        const tableBody = document.getElementById('healthTableBody');
        tableBody.innerHTML = '';

        resources.forEach(res => {
          const healthBadge = `<span class="badge ${healthBadgeClass(res.health_status)}">${res.health_status}</span>`;
          const rowClass = res.health_status === 'CRITICAL' ? 'table-danger' : '';

          const row = `
            <tr class="${rowClass}">
              <td class="fw-semibold">${res.resource_name}</td>
              <td>${res.resource_type}</td>
              <td>${res.region ?? '-'}</td>
              <td>${res.username}</td>
              <td>${formatMetric(res.cpu_usage_pct)}${res.cpu_usage_pct !== null ? '%' : ''}</td>
              <td>${formatMetric(res.memory_usage_pct)}${res.memory_usage_pct !== null ? '%' : ''}</td>
              <td>${formatMetric(res.storage_used_gb)}</td>
              <td>${res.error_count}</td>
              <td>${healthBadge}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        console.error('Error fetching resource health:', error);
        document.getElementById('healthTableBody').innerHTML = 
          `<tr><td colspan="9" class="text-center text-danger">Failed to load resource health. Is the backend server running?</td></tr>`;
      });
  </script>

</body>
</html>
