<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Plans - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search plans...">
        </div>

        <div class="row g-3" id="plansCards">
          <p class="text-center text-muted">Loading plans...</p>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('plans');
    enableCardSearch('searchInput', 'plansCards', '.col-md-4');

    function serviceBadgeClass(type) {
      if (type === 'SaaS') return 'bg-primary';
      if (type === 'PaaS') return 'bg-success';
      if (type === 'IaaS') return 'bg-warning text-dark';
      return 'bg-secondary';
    }

    fetch('http://localhost:3000/api/plans')
      .then(response => response.json())
      .then(plans => {
        const container = document.getElementById('plansCards');
        container.innerHTML = '';

        plans.forEach(plan => {
          const card = `
            <div class="col-md-4">
              <div class="card shadow-sm h-100">
                <div class="card-body">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title mb-0">${plan.plan_name}</h5>
                    <span class="badge ${serviceBadgeClass(plan.service_type)}">${plan.service_type}</span>
                  </div>
                  <p class="text-muted small mb-3">Tier: ${plan.tier_name} · Support: ${plan.support_level}</p>
                  
                  <h3 class="mb-0">$${Number(plan.monthly_price).toFixed(2)}<span class="fs-6 text-muted">/mo</span></h3>
                  <p class="text-muted small mb-3">or $${Number(plan.annual_price).toFixed(2)}/year</p>

                  <p class="small mb-0"><i class="bi bi-people-fill"></i> Up to <strong>${plan.max_users}</strong> users</p>
                </div>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      })
      .catch(error => {
        console.error('Error fetching plans:', error);
        document.getElementById('plansCards').innerHTML = 
          `<p class="text-center text-danger">Failed to load plans. Is the backend server running?</p>`;
      });
  </script>

</body>
</html>
