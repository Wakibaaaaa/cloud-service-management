<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search invoices...">
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Invoice #</th>
                  <th>User</th>
                  <th>Organization</th>
                  <th>Invoice Date</th>
                  <th>Due Date</th>
                  <th>Total</th>
                  <th>Invoice Status</th>
                  <th>Payment Method</th>
                  <th>Payment Status</th>
                  <th>Days Overdue</th>
                </tr>
              </thead>
              <tbody id="billingTableBody">
                <tr><td colspan="10" class="text-center text-muted">Loading billing data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('billing');
    enableTableSearch('searchInput', 'billingTableBody');

    function invoiceBadgeClass(status) {
      if (status === 'Paid') return 'bg-success';
      if (status === 'Pending') return 'bg-warning text-dark';
      if (status === 'Overdue') return 'bg-danger';
      if (status === 'Cancelled') return 'bg-secondary';
      return 'bg-light text-dark border';
    }

    function paymentBadgeClass(status) {
      if (status === 'Completed') return 'bg-success';
      if (status === 'Pending') return 'bg-warning text-dark';
      if (status === 'Failed') return 'bg-danger';
      return 'bg-light text-dark border';
    }

    fetch('http://localhost:3000/api/billing')
      .then(response => response.json())
      .then(invoices => {
        const tableBody = document.getElementById('billingTableBody');
        tableBody.innerHTML = '';

        invoices.forEach(inv => {
          const invoiceBadge = `<span class="badge ${invoiceBadgeClass(inv.invoice_status)}">${inv.invoice_status}</span>`;
          const paymentBadge = inv.payment_status 
            ? `<span class="badge ${paymentBadgeClass(inv.payment_status)}">${inv.payment_status}</span>`
            : `<span class="badge bg-light text-dark border">No payment yet</span>`;

          const rowClass = inv.days_overdue > 0 ? 'table-danger' : '';

          const row = `
            <tr class="${rowClass}">
              <td class="fw-semibold">${inv.invoice_number}</td>
              <td>${inv.username}</td>
              <td>${inv.org_name ?? '-'}</td>
              <td>${new Date(inv.invoice_date).toLocaleDateString()}</td>
              <td>${new Date(inv.due_date).toLocaleDateString()}</td>
              <td>$${Number(inv.total_amount).toFixed(2)}</td>
              <td>${invoiceBadge}</td>
              <td>${inv.payment_method ?? '-'}</td>
              <td>${paymentBadge}</td>
              <td>${inv.days_overdue > 0 ? inv.days_overdue + ' days' : '—'}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        console.error('Error fetching billing data:', error);
        document.getElementById('billingTableBody').innerHTML = 
          `<tr><td colspan="10" class="text-center text-danger">Failed to load billing data. Is the backend server running?</td></tr>`;
      });
  </script>

</body>
</html>
