<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>

      <div class="container-fluid py-4 px-4">

        <div class="row g-3" id="statsCards">
          <!-- Cards get inserted here by JavaScript -->
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('dashboard');

    function buildCard(label, value, colorClass, icon) {
      return `
        <div class="col-md-3 col-sm-6">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted small mb-1">${label}</p>
                  <h3 class="mb-0 ${colorClass}">${value}</h3>
                </div>
                <div class="fs-1">${icon}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    fetch('http://localhost:3000/api/dashboard-stats')
      .then(response => response.json())
      .then(stats => {
        const cardsHtml = 
          buildCard('Total Users', stats.total_users, 'text-primary', '👥') +
          buildCard('Active Users', stats.active_users, 'text-success', '✅') +
          buildCard('Active Subscriptions', stats.active_subscriptions, 'text-info', '📦') +
          buildCard('Total Resources', stats.total_resources, 'text-secondary', '🖥️') +
          buildCard('Running Resources', stats.running_resources, 'text-success', '🟢') +
          buildCard('Critical Resources', stats.critical_resources, 'text-danger', '🔴') +
          buildCard('Warning Resources', stats.warning_resources, 'text-warning', '🟡') +
          buildCard('Revenue (Paid)', '$' + Number(stats.total_revenue).toLocaleString(), 'text-success', '💰') +
          buildCard('Total Invoices', stats.total_invoices, 'text-primary', '🧾') +
          buildCard('Open Tickets', stats.open_tickets, 'text-danger', '🎫');

        document.getElementById('statsCards').innerHTML = cardsHtml;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('statsCards').innerHTML = 
          `<p class="text-danger">Failed to load dashboard stats. Is the backend running?</p>`;
      });
  </script>

</body>
</html>
