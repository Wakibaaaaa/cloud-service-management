<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      font-family: 'Roboto', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Faint moving grid, like a HUD / sci-fi console */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Glowing floating orbs drifting in the background */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      z-index: 0;
    }
    .orb-1 {
      width: 380px; height: 380px;
      background: #00e5ff;
      top: -100px; left: -100px;
      animation: float1 14s ease-in-out infinite;
    }
    .orb-2 {
      width: 320px; height: 320px;
      background: #7c4dff;
      bottom: -100px; right: -80px;
      animation: float2 16s ease-in-out infinite;
    }
    .orb-3 {
      width: 260px; height: 260px;
      background: #1a73e8;
      bottom: 20%; left: 8%;
      animation: float3 12s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(60px, 80px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-50px, -60px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -40px) scale(1.15); }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      width: 400px;
      padding: 40px 36px;
      background: rgba(20, 24, 32, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), 0 0 100px rgba(124, 77, 255, 0.1);
      animation: cardIn 0.6s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-icon {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-subtitle {
      color: #8b93a7;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-label {
      color: #9aa4b8;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .futuristic-input {
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid rgba(0, 229, 255, 0.2) !important;
      color: #e8eaf0 !important;
      border-radius: 8px !important;
      padding: 10px 14px !important;
    }
    .futuristic-input::placeholder {
      color: #5a6478;
    }
    .futuristic-input:focus {
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15) !important;
      border-color: #00e5ff !important;
    }

    .btn-futuristic {
      background: linear-gradient(135deg, #00e5ff, #1a73e8);
      border: none;
      color: #05070d;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 11px;
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-futuristic:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
      color: #05070d;
    }

    .hint-text {
      color: #6b7385;
      font-size: 0.78rem;
    }
    .hint-text strong {
      color: #00e5ff;
    }

    #errorMessage {
      color: #ff5c7a;
    }
  </style>
</head>
<body>

  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="text-center mb-4">
        <div class="brand-icon mb-2"><i class="bi bi-cloud-fill"></i></div>
        <div class="brand-title">CLOUD MANAGER</div>
        <div class="brand-subtitle">Secure Access Terminal</div>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control futuristic-input" id="username" placeholder="e.g. john.smith" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control futuristic-input" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-futuristic w-100"><i class="bi bi-box-arrow-in-right"></i> Log In</button>

        <p id="errorMessage" class="small mt-3 text-center mb-0"></p>
      </form>

      <p class="hint-text text-center mt-4 mb-0">
        Test login: <strong>john.smith</strong> / <strong>Test1234!</strong>
      </p>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      errorMessage.textContent = '';

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorMessage.textContent = data.error;
          return;
        }

        localStorage.setItem('currentUser', JSON.stringify(data));
        window.location.href = 'dashboard.html';

      } catch (error) {
        errorMessage.textContent = 'Could not reach the server. Is it running?';
      }
    });
  </script>

</body>
</html>
