<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="input-group search-box mb-0">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchInput" placeholder="Search resources...">
          </div>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newResourceModal">
            <i class="bi bi-plus-lg"></i> New Resource
          </button>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Resource Name</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Region</th>
                  <th>IP Address</th>
                  <th>Owner</th>
                  <th>Organization</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="resourcesTableBody">
                <tr><td colspan="9" class="text-center text-muted">Loading resources...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ===================== New Resource Modal ===================== -->
  <div class="modal fade" id="newResourceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-hdd-stack-fill"></i> Provision a New Resource</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="newResourceForm">
          <div class="modal-body">

            <div class="mb-3">
              <label class="form-label">Resource Name</label>
              <input type="text" class="form-control" id="resourceName" placeholder="e.g. MyApp-WebServer-02" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Resource Type</label>
              <select class="form-select" id="resourceType" required>
                <option value="">Loading...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Assign to Subscription</label>
              <select class="form-select" id="resourceSubscription" required>
                <option value="">Loading...</option>
              </select>
              <div class="form-text">The resource's owner is taken automatically from the chosen subscription.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Region (optional)</label>
              <input type="text" class="form-control" id="resourceRegion" placeholder="e.g. US East">
            </div>

            <div class="mb-3">
              <label class="form-label">IP Address (optional)</label>
              <input type="text" class="form-control" id="resourceIp" placeholder="e.g. 54.23.12.100">
            </div>

            <p id="resourceFormError" class="text-danger small mb-0"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Resource</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('resources');
    enableTableSearch('searchInput', 'resourcesTableBody');

    function statusBadgeClass(status) {
      if (status === 'Running') return 'bg-success';
      if (status === 'Stopped') return 'bg-secondary';
      if (status === 'Terminated') return 'bg-dark';
      if (status === 'Pending') return 'bg-warning text-dark';
      if (status === 'Error') return 'bg-danger';
      return 'bg-secondary';
    }

    // ---------- READ ----------
    function loadResources() {
      fetch('http://localhost:3000/api/resources')
        .then(response => response.json())
        .then(resources => {
          const tableBody = document.getElementById('resourcesTableBody');
          tableBody.innerHTML = '';

          resources.forEach(res => {
            const statusOptions = ['Running', 'Stopped', 'Terminated', 'Pending', 'Error']
              .map(s => `<option value="${s}" ${s === res.status ? 'selected' : ''}>${s}</option>`)
              .join('');

            const row = `
              <tr>
                <td class="fw-semibold">${res.resource_name}</td>
                <td>${res.resource_type}</td>
                <td><span class="badge bg-light text-dark border">${res.type_category}</span></td>
                <td>
                  <select class="form-select form-select-sm" style="width:130px;" 
                          onchange="updateResourceStatus(${res.resource_id}, this.value)">
                    ${statusOptions}
                  </select>
                </td>
                <td>${res.region ?? '-'}</td>
                <td>${res.ip_address ?? '-'}</td>
                <td>${res.username}</td>
                <td>${res.org_name ?? '-'}</td>
                <td>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteResource(${res.resource_id})">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            `;
            tableBody.innerHTML += row;
          });
        })
        .catch(error => {
          console.error('Error fetching resources:', error);
          document.getElementById('resourcesTableBody').innerHTML =
            `<tr><td colspan="9" class="text-center text-danger">Failed to load resources. Is the backend server running?</td></tr>`;
        });
    }

    // ---------- UPDATE ----------
    function updateResourceStatus(resourceId, newStatus) {
      fetch(`http://localhost:3000/api/resources/${resourceId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status_name: newStatus })
      })
        .then(response => response.json())
        .then(() => loadResources())
        .catch(error => {
          console.error('Error updating resource:', error);
          alert('Failed to update resource status.');
        });
    }

    // ---------- DELETE ----------
    function deleteResource(resourceId) {
      if (!confirm('Are you sure you want to delete this resource? This cannot be undone.')) {
        return;
      }
      fetch(`http://localhost:3000/api/resources/${resourceId}`, { method: 'DELETE' })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert(data.error); // e.g. "has usage history, cannot delete"
            return;
          }
          loadResources();
        })
        .catch(error => {
          console.error('Error deleting resource:', error);
          alert('Failed to delete resource.');
        });
    }

    // ---------- CREATE: populate dropdowns ----------
    fetch('http://localhost:3000/api/resource-options')
      .then(response => response.json())
      .then(options => {
        const typeSelect = document.getElementById('resourceType');
        typeSelect.innerHTML = options.types
          .map(t => `<option value="${t.resource_type_id}">${t.type_name}</option>`).join('');

        const subSelect = document.getElementById('resourceSubscription');
        subSelect.innerHTML = options.subscriptions
          .map(s => `<option value="${s.subscription_id}">${s.username} - ${s.plan_name}</option>`).join('');
      })
      .catch(error => console.error('Error loading resource options:', error));

    // ---------- CREATE: handle form submission ----------
    document.getElementById('newResourceForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const errorEl = document.getElementById('resourceFormError');
      errorEl.textContent = '';

      const payload = {
        resource_name: document.getElementById('resourceName').value,
        resource_type_id: document.getElementById('resourceType').value,
        subscription_id: document.getElementById('resourceSubscription').value,
        region: document.getElementById('resourceRegion').value,
        ip_address: document.getElementById('resourceIp').value
      };

      fetch('http://localhost:3000/api/resources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            errorEl.textContent = data.error;
            return;
          }
          bootstrap.Modal.getInstance(document.getElementById('newResourceModal')).hide();
          document.getElementById('newResourceForm').reset();
          loadResources();
        })
        .catch(error => {
          console.error('Error creating resource:', error);
          errorEl.textContent = 'Could not reach the server.';
        });
    });

    loadResources();
  </script>

</body>
</html>
