<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscriptions - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search subscriptions...">
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>User</th>
                  <th>Organization</th>
                  <th>Service</th>
                  <th>Plan</th>
                  <th>Tier</th>
                  <th>Billing Cycle</th>
                  <th>Start Date</th>
                  <th>End Date</th>
                  <th>Monthly Cost</th>
                </tr>
              </thead>
              <tbody id="subsTableBody">
                <tr><td colspan="9" class="text-center text-muted">Loading subscriptions...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('subscriptions');
    enableTableSearch('searchInput', 'subsTableBody');

    function serviceBadgeClass(type) {
      if (type === 'SaaS') return 'bg-primary';
      if (type === 'PaaS') return 'bg-success';
      if (type === 'IaaS') return 'bg-warning text-dark';
      return 'bg-secondary';
    }

    fetch('http://localhost:3000/api/subscriptions')
      .then(response => response.json())
      .then(subs => {
        const tableBody = document.getElementById('subsTableBody');
        tableBody.innerHTML = '';

        if (subs.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">No active subscriptions found.</td></tr>`;
          return;
        }

        subs.forEach(sub => {
          const serviceBadge = `<span class="badge ${serviceBadgeClass(sub.service_type)}">${sub.service_type}</span>`;
          const endDate = sub.end_date ? new Date(sub.end_date).toLocaleDateString() : '—';
          const startDate = new Date(sub.start_date).toLocaleDateString();

          const row = `
            <tr>
              <td>${sub.username}</td>
              <td>${sub.org_name ?? '-'}</td>
              <td>${serviceBadge}</td>
              <td>${sub.plan_name}</td>
              <td>${sub.plan_tier}</td>
              <td>${sub.billing_cycle}</td>
              <td>${startDate}</td>
              <td>${endDate}</td>
              <td>$${Number(sub.monthly_cost).toFixed(2)}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        console.error('Error fetching subscriptions:', error);
        document.getElementById('subsTableBody').innerHTML = 
          `<tr><td colspan="9" class="text-center text-danger">Failed to load subscriptions. Is the backend server running?</td></tr>`;
      });
  </script>

</body>
</html>
