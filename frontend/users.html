<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search users...">
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Full Name</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Organization</th>
                  <th>MFA</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="7" class="text-center text-muted">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('users');
    enableTableSearch('searchInput', 'usersTableBody');

    fetch('http://localhost:3000/api/users')
      .then(response => response.json())
      .then(users => {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = '';

        users.forEach(user => {
          const statusBadge = user.status_name === 'Active' 
            ? `<span class="badge bg-success">Active</span>` 
            : `<span class="badge bg-secondary">${user.status_name}</span>`;

          const mfaBadge = user.mfa_enabled 
            ? `<span class="badge bg-info text-dark">On</span>` 
            : `<span class="badge bg-warning text-dark">Off</span>`;

          const row = `
            <tr>
              <td>${user.username}</td>
              <td>${user.email}</td>
              <td>${user.full_name}</td>
              <td>${user.role_name}</td>
              <td>${statusBadge}</td>
              <td>${user.org_name ?? '-'}</td>
              <td>${mfaBadge}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        console.error('Error fetching users:', error);
        document.getElementById('usersTableBody').innerHTML = 
          `<tr><td colspan="7" class="text-center text-danger">Failed to load users. Is the backend server running?</td></tr>`;
      });
  </script>

</body>
</html>
