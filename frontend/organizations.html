<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizations - Cloud Service Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="app-layout">
    <div id="sidebar"></div>

    <div class="main-content">
      <div class="topbar" id="topbar"></div>
      <div class="container-fluid py-4 px-4">

        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search organizations...">
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Organization</th>
                  <th>Industry</th>
                  <th>Country</th>
                  <th>Email</th>
                  <th>Size</th>
                  <th>Users</th>
                </tr>
              </thead>
              <tbody id="orgsTableBody">
                <tr><td colspan="6" class="text-center text-muted">Loading organizations...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderSidebar('organizations');
    enableTableSearch('searchInput', 'orgsTableBody');

    fetch('http://localhost:3000/api/organizations')
      .then(response => response.json())
      .then(orgs => {
        const tableBody = document.getElementById('orgsTableBody');
        tableBody.innerHTML = '';

        orgs.forEach(org => {
          const sizeBadge = `<span class="badge bg-secondary">${org.size_name ?? 'Unknown'}</span>`;

          const row = `
            <tr>
              <td class="fw-semibold">${org.org_name}</td>
              <td>${org.industry ?? '-'}</td>
              <td>${org.country ?? '-'}</td>
              <td>${org.email ?? '-'}</td>
              <td>${sizeBadge}</td>
              <td>${org.user_count}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      })
      .catch(error => {
        console.error('Error fetching organizations:', error);
        document.getElementById('orgsTableBody').innerHTML = 
          `<tr><td colspan="6" class="text-center text-danger">Failed to load organizations. Is the backend server running?</td></tr>`;
      });
  </script>

</body>
</html>
